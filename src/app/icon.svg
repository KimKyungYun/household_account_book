<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!--
    브라우저 탭 아이콘 = 메인 로고. CSS 변수를 읽을 수 없어 색을 직접 적는다 — 주황은
    styles/tokens/_semantic.scss 의 brand 토큰, 글자 좌표는 components/common/Logo 와 같다.

    주의: XML 주석에는 이중 하이픈을 쓸 수 없다. CSS 변수명을 앞의 하이픈까지
    그대로 적으면 SVG 전체가 파싱 에러로 죽어 탭 아이콘이 통째로 사라진다.
  -->
  <rect width="180" height="180" rx="40" fill="#ff8a00"/>
  <svg x="24" y="58" width="132" height="64" viewBox="-10 -4 211 103">
    <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 27 L36 7 L62 27 L62 61 L10 61 Z"/>
      <line x1="36" y1="61" x2="36" y2="88"/>
      <line x1="1" y1="88" x2="71" y2="88"/>
      <circle cx="124" cy="47" r="22"/>
      <line x1="168" y1="7" x2="168" y2="88"/>
      <line x1="168" y1="47" x2="188" y2="47"/>
    </g>
  </svg>
</svg>
